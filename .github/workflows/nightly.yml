# Muhammad CLAP — multi-platform nightlies
# Free on public repos. Produces:
#   linux-x64  : full plugin WITH GUI + runs the whole test suite + golden images
#   win-x64    : full panel, cross-compiled with MinGW-w64 (WGL shim; runtime
#                validation happens on tester machines, build+exports gate here)
#   macos      : universal (arm64+x86_64) plugin with the cocoa NSView shim,
#                wrapped as a .clap bundle (compile-gated in CI)
# Wrappers (tools/make_wrappers.sh, dynamic-load clap-wrapper): VST3 on all
# three platforms, AUv2 on macOS, simple standalone everywhere - native
# windows-latest leg so the Steinberg SDK sees MSVC, not MinGW.
# On tags v* it additionally publishes a GitHub Release with all three artifacts.

name: build

permissions:
  contents: read        # least-privilege default; the release job opts up (B: CI hygiene)

on:
  schedule:
    - cron: '15 4 * * *'          # daily ~05:15 AEDT / 14:15 UTC+AEDT-ish; UTC 04:15
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      ver: ${{ steps.v.outputs.ver }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          VER=$(grep -m1 'set(P5_VERSION' CMakeLists.txt | sed 's/.*"\(.*\)".*/\1/')
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "version: $VER"

  linux:
    needs: version
    runs-on: ubuntu-24.04   # owner's baseline; NO older-glibc support matrix.
    # The glibc-ceiling step below just REPORTS what the binary demands.
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          # libasound2-dev + libjack-jackd2-dev: ONLY needed by the
          # standalone wrapper (rtaudio hard-requests ALSA/JACK dev on Linux);
          # the plugin itself never touches audio APIs.
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libgl1-mesa-dev libegl1-mesa-dev libglx-dev \
            libegl1 libgl1 libglx-mesa0 mesa-libgallium libgl1-mesa-dri \
            libasound2-dev libjack-jackd2-dev \
            imagemagick x11-utils
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j"$(nproc)"
      - name: "tests (ctest registry - a new test runs without YAML edits, B10)"
        working-directory: build
        run: ctest --output-on-failure -E '^threadsan$'
      - name: "audio-thread allocation watchdog (B11: allocwatch was never preloaded in CI)"
        working-directory: build
        run: |
          LD_PRELOAD="$PWD/allocwatch.so" P5_STORE_DIR=/tmp/muh-ci \
            ./clap_smoke ./muhammad.clap | tee /tmp/alloc.log
          grep -q 'audio-thread allocs.*: 0' /tmp/alloc.log
      - name: glibc ceiling of the shipped .clap (informational - not a support contract)
        run: objdump -T build/muhammad.clap | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1
      - name: golden images
        # surfaceless EGL needs the Mesa RUNTIME driver (llvmpipe), not just
        # -dev headers: --no-install-recommends silently drops it otherwise.
        # Verified locally: llvmpipe reproduces every golden at 0.000% diff.
        run: EGL_PLATFORM_SURFACELESS_MESA=1 bash tools/check_goldens.sh
      - uses: actions/upload-artifact@v4
        with:
          name: muhammad-${{ needs.version.outputs.ver }}-linux-x64.clap
          path: build/muhammad.clap
      - name: wrappers (VST3 + standalone)
        run: bash tools/make_wrappers.sh
      - name: tar the wrappers (execute bits survive; upload-artifact flattens modes)
        run: tar -czf muhammad-${{ needs.version.outputs.ver }}-linux-x64-wrappers.tar.gz -C dist wrappers
      - uses: actions/upload-artifact@v4
        with:
          name: muhammad-${{ needs.version.outputs.ver }}-linux-x64-wrappers-tar
          path: muhammad-${{ needs.version.outputs.ver }}-linux-x64-wrappers.tar.gz

  tsan:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DMUHAMMAD_TSAN=ON -DMUHAMMAD_GUI=OFF -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --target test_threadsan -j"$(nproc)"
      - name: "ThreadSanitizer stress (audio thread runs process+flush+reset; main runs the panel)"
        # setarch -R: some kernels lay out mmap() where GCC's libtsan shadow
        # collides ("unexpected memory mapping" at startup - reproduced on
        # 6.8 custom kernels). Disabling ASLR for the test run is the stock
        # workaround and harmless when unneeded.
        run: setarch "$(uname -m)" -R ./build/test_threadsan

  asan-ubsan:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libx11-dev libgl1-mesa-dev libegl1-mesa-dev libglx-dev
      - run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DMUHAMMAD_GUI=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -O1"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: |
          cmake --build build -j"$(nproc)" > build.log 2>&1 || { tail -40 build.log; exit 1; }
          tail -3 build.log
      - name: state/preset parsers + engine under ASan+UBSan
        working-directory: build
        run: |
          export ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1
          ctest --output-on-failure -E 'threadsan|smoke'


  windows:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64
      - run: >
          cmake -B build-win -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x64.cmake -DMUHAMMAD_GUI=ON
      - run: cmake --build build-win -j"$(nproc)"
      - name: sanity (PE exports clap_entry, no stray DLL deps)
        run: |
          x86_64-w64-mingw32-objdump -x build-win/muhammad.clap | grep -q '\[   0\] clap_entry'
          ! x86_64-w64-mingw32-objdump -p build-win/muhammad.clap | grep -q 'libstdc++'
      - uses: actions/upload-artifact@v4
        with:
          name: muhammad-${{ needs.version.outputs.ver }}-win-x64.clap
          path: build-win/muhammad.clap

  windows-wrappers:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: wrappers (VST3 + standalone)
        shell: bash
        run: bash tools/make_wrappers.sh
      - name: tar the wrappers
        shell: bash
        run: tar -czf muhammad-${{ needs.version.outputs.ver }}-win-x64-wrappers.tar.gz -C dist wrappers
      - uses: actions/upload-artifact@v4
        with:
          name: muhammad-${{ needs.version.outputs.ver }}-win-x64-wrappers-tar
          path: muhammad-${{ needs.version.outputs.ver }}-win-x64-wrappers.tar.gz

  macos:
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DMUHAMMAD_GUI=ON -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - run: cmake --build build -j"$(sysctl -n hw.ncpu)"
      - name: "tests (B13: macOS ran a subset while the README claimed more)"
        working-directory: build
        run: |
          ctest --output-on-failure -E 'threadsan'
      - name: bundle
        run: bash tools/make_mac_bundle.sh build/muhammad.clap dist/muhammad.clap
      - name: "ad-hoc sign the bundle (B5: unsigned mac downloads die at Gatekeeper)"
        run: codesign --force --deep --sign - dist/muhammad.clap || true
      - name: "tar the bundle (upload-artifact drops Unix modes; B4)"
        run: tar -czf muhammad-${{ needs.version.outputs.ver }}-macos-universal.clap.tar.gz -C dist muhammad.clap
      - uses: actions/upload-artifact@v4
        with:
          name: muhammad-${{ needs.version.outputs.ver }}-macos-universal-tar
          path: muhammad-${{ needs.version.outputs.ver }}-macos-universal.clap.tar.gz
      - name: wrappers (VST3 + AUv2 + standalone)
        run: bash tools/make_wrappers.sh
      - name: tar the wrappers
        run: tar -czf muhammad-${{ needs.version.outputs.ver }}-macos-wrappers.tar.gz -C dist wrappers
      - uses: actions/upload-artifact@v4
        with:
          name: muhammad-${{ needs.version.outputs.ver }}-macos-wrappers-tar
          path: muhammad-${{ needs.version.outputs.ver }}-macos-wrappers.tar.gz

  release:
    needs: [version, linux, windows, windows-wrappers, macos, tsan, asan-ubsan]   # B14: never ship a tag the sanitizers red-flagged
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: "stage tar artifacts (jobs upload tarballs: modes survive)"
        run: |
          for t in assets/*-wrappers-tar/*.tar.gz assets/*-universal-tar/*.tar.gz; do
            [ -f "$t" ] || continue
            cp "$t" .
          done
      - name: stage claps under unique names
        # linux/windows upload the FILE muhammad.clap (artifact dir contains
        # it); macOS ships the BUNDLE as a .clap.tar.gz staged above (tar
        # preserves Contents/ modes - upload-artifact's zip flattening did
        # not, review B4). Flatten the file forms to basename-unique assets:
        # softprops keys assets by basename (three identical muhammad.clap
        # silently clobbered each other before eea68ca).
        run: |
          for d in assets/*.clap; do
            [ -d "$d" ] || continue
            name=$(basename "$d")                        # muhammad-VER-PLATFORM.clap
            if [ -f "$d/muhammad.clap" ]; then           # linux / windows: one file
              mv "$d/muhammad.clap" "./$name"
            elif [ -d "$d/Contents" ]; then              # legacy bundle shape (pre-tar runs)
              mv "$d" "./muhammad.clap"
              zip -qr "./$name.zip" "muhammad.clap"
              rm -rf "./muhammad.clap"
            else
              echo "::error::unrecognized clap artifact shape in $d"; ls -R "$d"; exit 1
            fi
          done
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true    # commit log under the static blurb:
          append_body: true               # a tester tag carries its own story
          files: |
            muhammad-*.clap
            muhammad-*.clap.zip
            muhammad-*.clap.tar.gz
            muhammad-*-wrappers.tar.gz
          body: >
            Muhammad ${{ needs.version.outputs.ver }} — CLAP for linux-x64,
            win-x64 and macos-universal, plus wrapper bundles (VST3 on all
            platforms; macOS also gets AUv2; every platform gets the simple
            standalone host). The wrappers embed the engine and panel -
            they need NO separate muhammad.clap installation (0.2.x
            clap-first builds; B15 corrected the old text). Install the
            .vst3/.component/standalone from the wrapper tarballs; keep file
            modes by extracting with tar. macOS builds are ad-hoc signed:
            first launch may need `xattr -dr com.apple.quarantine` on the
            download.
